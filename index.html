body {
  margin: 0;
  font-family: Arial;
  background: #f9f9f9;
  color: #222;
}

    /* NAVBAR */
    .navbar{
      position: fixed;
      top: 0;
      width: 100%;
      padding: 20px 8%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(0,0,0,0.8);
      backdrop-filter: blur(10px);
      z-index: 1000;
    }

    .logo{
      font-size: 28px;
      font-weight: bold;
      color: #00ff99;
      letter-spacing: 2px;
    }

    .nav-links{
      display: flex;
      gap: 25px;
    }

    .nav-links a{
      color: white;
      text-decoration: none;
      font-size: 16px;
      transition: 0.3s;
    }

    .nav-links a:hover{
      color: #00ff99;
    }

    /* HERO SECTION */
    .hero{
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 120px 20px;
      background:
      linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.8)),
      url('elvis.jpg') center/cover;
    }

    .hero-content h1{
      font-size: 70px;
      margin-bottom: 15px;
      letter-spacing: 3px;
    }

    .hero-content span{
      color: #00ff99;
    }

    .hero-content p{
      font-size: 22px;
      color: #ccc;
      margin-bottom: 30px;
    }

    .hero-btn{
      display: inline-block;
      padding: 14px 30px;
      background: #00ff99;
      color: black;
      text-decoration: none;
      font-weight: bold;
      border-radius: 30px;
      transition: 0.3s;
    }

    .hero-btn:hover{
      transform: scale(1.05);
    }

    /* SOCIAL ICONS */
    .social-icons{
      margin-top: 30px;
      display: flex;
      justify-content: center;
      gap: 20px;
    }

    .social-icons a{
      color: white;
      font-size: 28px;
      transition: 0.3s;
    }

    .social-icons a:hover{
      color: #00ff99;
      transform: translateY(-5px);
    }

    /* SECTION STYLING */
    section{
      padding: 100px 8%;
    }

    .section-title{
      text-align: center;
      font-size: 40px;
      margin-bottom: 50px;
      color: #00ff99;
    }

    /* MUSIC SECTION */
    .music-container{
      display: grid;
      grid-template-columns: repeat(auto-fit,minmax(250px,1fr));
      gap: 25px;
    }

    .music-card{
      background: #1a1a1a;
      padding: 25px;
      border-radius: 15px;
      transition: 0.3s;
    }

    .music-card:hover{
      transform: translateY(-10px);
      box-shadow: 0 0 20px rgba(0,255,153,0.3);
    }

    .music-card h3{
      margin-bottom: 10px;
    }

    .listen-btn{
      display: inline-block;
      margin-top: 15px;
      padding: 10px 18px;
      background: #00ff99;
      color: black;
      text-decoration: none;
      border-radius: 20px;
      font-weight: bold;
    }

    /* ABOUT */
    .about{
      text-align: center;
      line-height: 1.8;
      font-size: 18px;
      color: #ddd;
    }

    /* CONTACT */
    .contact-box{
      text-align: center;
    }

    .contact-box p{
      margin: 15px 0;
      font-size: 18px;
    }

    /* FOOTER */
    footer{
      text-align: center;
      padding: 30px;
      background: #000;
      color: #888;
    }

    /* MOBILE */
    @media(max-width:768px){

      .hero-content h1{
        font-size: 45px;
      }

      .hero-content p{
        font-size: 18px;
      }

      .nav-links{
        gap: 15px;
      }

    }

  </style>
